<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#5a6478"/>
  </marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#9aa4b8"/>
  </marker>
</defs>
<style>
  .ttl{font-size:27px;font-weight:700;fill:#1a1f2e}
  .sub{font-size:15.5px;fill:#5a6478}
  .box{fill:#ffffff;stroke:#c3cad6;stroke-width:1.6;rx:7}
  .lbl{font-size:15.5px;font-weight:600;fill:#1a1f2e;text-anchor:middle}
  .cap{font-size:12.5px;fill:#5a6478;text-anchor:middle}
  .ln{stroke:#5a6478;stroke-width:1.7;fill:none;marker-end:url(#a)}
  .dln{stroke:#9aa4b8;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#ad)}
  .panel{fill:#f6f8fb;stroke:#d6dde8;stroke-width:1.5;rx:9}
  .ph{font-size:16px;font-weight:700;fill:#1a1f2e}
  .pt{font-size:13.5px;fill:#3c4556}
  .ptm{font-size:12.5px;fill:#5a6478}
  .mono{font-family:Consolas, DejaVu Sans Mono, monospace;font-size:12.5px;fill:#3c4556}
  .grn{fill:#2d7d5a}.blu{fill:#2f5d9e}.pur{fill:#6b4e9e}
  .tag{font-size:11.5px;font-weight:700;letter-spacing:.5px}
  .num{font-size:21px;font-weight:700;fill:#1a1f2e}
</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="ttl" x="56" y="56">Research Paper Navigator</text>
<text class="sub" x="56" y="82">Request path, and the two subsystems it calls into. 153 research-paper PDFs &#183; 23,560 chunks &#183; 137 papers in the graph</text>
<line x1="56" y1="100" x2="1544" y2="100" stroke="#e4e9f0" stroke-width="1.5"/>

<!-- ============ REQUEST PATH ============ -->
<text class="tag grn" x="56" y="132">REQUEST PATH</text>

<rect class="box" x="56"  y="150" width="124" height="66"/>
<text class="lbl" x="118" y="190">question</text>

<path class="ln" d="M186 183 H208"/>

<rect class="box" x="214" y="150" width="148" height="66" stroke="#2d7d5a"/>
<text class="lbl" x="288" y="182">sanitize</text>
<text class="cap" x="288" y="202">defence 1</text>
<text class="cap" x="288" y="236">strip override and roleplay,</text>
<text class="cap" x="288" y="252">escape XML, keep the question</text>
<text class="cap grn" x="288" y="272" style="font-weight:600">0/18 false positives</text>

<path class="ln" d="M368 183 H390"/>

<rect class="box" x="396" y="150" width="124" height="66"/>
<text class="lbl" x="458" y="182">route</text>
<text class="cap" x="458" y="202">regex</text>
<text class="cap" x="458" y="236">11/12 correct</text>
<text class="cap" x="458" y="252">(starter: 8/12)</text>

<path class="ln" d="M526 168 H556"/>
<path class="ln" d="M526 198 H556"/>

<rect class="box" x="562" y="128" width="216" height="58" stroke="#2f5d9e"/>
<text class="lbl blu" x="670" y="152">direct</text>
<text class="cap" x="670" y="172">one answer call &#183; ~1,381 tok</text>

<rect class="box" x="562" y="196" width="216" height="80" stroke="#6b4e9e"/>
<text class="lbl pur" x="670" y="220">agentic loop</text>
<text class="cap" x="670" y="239">decide &#8594; act &#8594; reassess</text>
<text class="cap" x="670" y="255">max 4 steps &#183; ~3,312 tok</text>
<text class="cap pur" x="670" y="271" style="font-weight:600">planner = 62% of all tokens</text>

<path class="ln" d="M784 157 H812"/>
<path class="ln" d="M784 236 H812"/>

<rect class="box" x="818" y="150" width="150" height="66" stroke="#2d7d5a"/>
<text class="lbl" x="893" y="182">answer</text>
<text class="cap" x="893" y="202">defence 2</text>
<text class="cap" x="893" y="236">XML trust boundary:</text>
<text class="cap" x="893" y="252">instructions vs retrieved text</text>
<text class="cap grn" x="893" y="272" style="font-weight:600">fake-source 20% &#8594; 0%</text>

<path class="ln" d="M974 183 H1000"/>

<rect class="box" x="1006" y="150" width="150" height="66" stroke="#2d7d5a"/>
<text class="lbl" x="1081" y="182">validate</text>
<text class="cap" x="1081" y="202">defence 3</text>
<text class="cap" x="1081" y="236">every cited filename</text>
<text class="cap" x="1081" y="252">must exist in the corpus</text>
<text class="cap" x="1081" y="272" style="font-weight:600;fill:#b8860b">7/7 in test, 0 fired live</text>

<path class="ln" d="M1162 183 H1188"/>

<rect class="box" x="1194" y="142" width="130" height="30"/>
<text class="lbl" x="1259" y="163" style="font-size:14px">answer</text>
<rect class="box" x="1194" y="176" width="130" height="30"/>
<text class="lbl" x="1259" y="197" style="font-size:14px">clarify</text>
<rect class="box" x="1194" y="210" width="130" height="30"/>
<text class="lbl" x="1259" y="231" style="font-size:14px">refuse</text>
<text class="cap" x="1259" y="262">grounded, or it</text>
<text class="cap" x="1259" y="278">declines to answer</text>

<line x1="56" y1="330" x2="1544" y2="330" stroke="#e4e9f0" stroke-width="1.5"/>

<!-- ============ SUBSYSTEMS ============ -->
<text class="tag grn" x="56" y="362">SUBSYSTEMS</text>

<!-- hybrid retrieval -->
<rect class="panel" x="56" y="380" width="716" height="452"/>
<text class="ph" x="80" y="412">Hybrid retrieval</text>
<text class="ptm" x="80" y="433">Two retrievers with incomparable score scales, normalised and fused</text>

<rect class="box" x="80" y="452" width="300" height="88"/>
<text class="pt" x="100" y="478" style="font-weight:700">BM25 Okapi</text>
<text class="ptm" x="100" y="499">lexical, over stopword-filtered tokens</text>
<text class="ptm" x="100" y="518">catches exact terms like &#8220;CEGIS&#8221;</text>

<rect class="box" x="400" y="452" width="348" height="88"/>
<text class="pt" x="420" y="478" style="font-weight:700">Dense vectors</text>
<text class="ptm" x="420" y="499">text-embedding-3-small, persisted in Chroma</text>
<text class="ptm" x="420" y="518">catches paraphrase the keywords miss</text>

<path class="ln" d="M230 546 V576"/>
<path class="ln" d="M574 546 V576"/>
<text class="ptm" x="246" y="568">20 candidates</text>
<text class="ptm" x="590" y="568">20 candidates</text>

<rect class="box" x="80" y="582" width="668" height="52"/>
<text class="pt" x="100" y="613">min&#8211;max normalise each list to [0,1], then fuse at <tspan class="mono">0.5 / 0.5</tspan></text>

<path class="ln" d="M414 640 V664"/>

<rect class="box" x="80" y="670" width="668" height="52"/>
<text class="pt" x="100" y="701">diversity cap: at most <tspan style="font-weight:700">2 chunks per paper</tspan> &#8594; top 5 to the context window</text>

<text class="ptm" x="80" y="756">Equal weighting is deliberate and untuned. Checkpoint 3.1 established that score</text>
<text class="ptm" x="80" y="776">magnitudes are not comparable across queries in this system, so fitting weights to a</text>
<text class="ptm" x="80" y="796">12-item evaluation set would have fitted noise rather than signal.</text>

<!-- paper graph -->
<rect class="panel" x="800" y="380" width="744" height="452"/>
<text class="ph" x="824" y="412">Paper graph</text>
<text class="ptm" x="824" y="433">Built once from the PDFs and cached. What makes lineage questions answerable.</text>

<rect class="box" x="824" y="452" width="150" height="76"/>
<text class="num" x="899" y="484" text-anchor="middle">137</text>
<text class="cap" x="899" y="506">papers (nodes)</text>
<rect class="box" x="990" y="452" width="150" height="76"/>
<text class="num" x="1065" y="484" text-anchor="middle">482</text>
<text class="cap" x="1065" y="506">relationships (edges)</text>
<rect class="box" x="1156" y="452" width="364" height="76"/>
<text class="ptm" x="1176" y="476"><tspan class="mono">similar_to</tspan>  382   title and abstract similarity</text>
<text class="ptm" x="1176" y="496"><tspan class="mono">cites</tspan>        73   reference lists matched to corpus titles</text>
<text class="ptm" x="1176" y="516"><tspan class="mono">duplicate_of</tspan>  27   preprint and published versions</text>

<text class="pt" x="824" y="566" style="font-weight:700">The four tools the planner may call</text>
<rect class="box" x="824" y="580" width="340" height="40"/>
<text class="mono" x="844" y="605">semantic_search</text>
<rect class="box" x="1180" y="580" width="340" height="40"/>
<text class="mono" x="1200" y="605">decompose_and_search</text>
<rect class="box" x="824" y="628" width="340" height="40" stroke="#6b4e9e"/>
<text class="mono" x="844" y="653">follow_citation</text>
<rect class="box" x="1180" y="628" width="340" height="40" stroke="#6b4e9e"/>
<text class="mono" x="1200" y="653">find_similar_papers</text>
<text class="ptm" x="824" y="690">The lower two traverse the graph; the upper two go to hybrid retrieval.</text>

<text class="ptm" x="824" y="736">16 of the 153 PDFs yield no usable title &#8212; scanned pages or mangled text &#8212; so they</text>
<text class="ptm" x="824" y="756">remain searchable but hold no edges. A known gap, documented rather than hidden.</text>

<!-- dashed calls -->
<path class="dln" d="M620 284 V380"/>
<text class="ptm" x="632" y="346">retrieve &#8212; both paths</text>
<path class="dln" d="M728 282 C 900 310, 1050 340, 1100 378"/>
<text class="ptm" x="880" y="328">traverse</text>
</svg>
